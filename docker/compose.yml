services:
  floral-sync-server:
    image: ${FLORAL_IMAGE:-floral-sync-server:local}
    restart: unless-stopped
    ports:
      - "${FLORAL_SYNC_PUBLISHED_PORT:-8787}:8787"
      - "${FLORAL_ADMIN_PUBLISHED_PORT:-8788}:8788"
    environment:
      FLORAL_SYNC_LISTEN: 0.0.0.0:8787
      FLORAL_ADMIN_LISTEN: 0.0.0.0:8788
      FLORAL_CONFIG_PATH: /var/lib/floral-sync/config/sync-server.toml
      FLORAL_DB_PATH: /var/lib/floral-sync/data/floral-sync.sqlite3
      FLORAL_EXPORT_DIR: /var/lib/floral-sync/exports
      FLORAL_LOG_PATH: /var/lib/floral-sync/logs/floral-sync-server.log
      FLORAL_LOG_LEVEL: ${FLORAL_LOG_LEVEL:-info}
      FLORAL_SYNC_TOKEN: ${FLORAL_SYNC_TOKEN:-}
      FLORAL_ADMIN_SESSION_SECRET: ${FLORAL_ADMIN_SESSION_SECRET:-}
      FLORAL_ADMIN_PASSWORD_HASH: ${FLORAL_ADMIN_PASSWORD_HASH:-}
      FLORAL_FORCE_WRITE_CONFIG: ${FLORAL_FORCE_WRITE_CONFIG:-0}
    volumes:
      - type: bind
        source: ${FLORAL_HOST_CONFIG_DIR:-./floral/config}
        target: /var/lib/floral-sync/config
        bind:
          create_host_path: true
      - type: bind
        source: ${FLORAL_HOST_DATA_DIR:-./floral/data}
        target: /var/lib/floral-sync/data
        bind:
          create_host_path: true
      - type: bind
        source: ${FLORAL_HOST_EXPORT_DIR:-./floral/exports}
        target: /var/lib/floral-sync/exports
        bind:
          create_host_path: true
      - type: bind
        source: ${FLORAL_HOST_LOG_DIR:-./floral/logs}
        target: /var/lib/floral-sync/logs
        bind:
          create_host_path: true
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL