name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish, for example v0.1.1
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi

          if [[ -z "$tag" ]]; then
            echo "::error::Unable to determine the release tag."
            exit 1
          fi

          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag does not exist in this repository."
            exit 1
          fi

          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error::Unable to read the package version from Cargo.toml."
            exit 1
          fi

          expected_tag="v$version"
          if [[ "$tag" != "$expected_tag" ]]; then
            echo "::error::Tag $tag does not match Cargo.toml version $version."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release build
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install admin UI dependencies
        run: npm --prefix admin-ui ci

      - name: Run tests
        run: cargo test --locked

      - name: Verify lite build
        run: cargo build --locked --release --no-default-features

  build-windows:
    name: Build Windows ${{ matrix.variant_label }}
    runs-on: windows-2025
    needs:
      - prepare
      - verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant_label: x86_64 full
            cargo_args: --locked --release
            artifact_prefix: floral-sync-server
            artifact_name: release-windows-x86_64-pc-windows-msvc
            with_admin: true
          - variant_label: x86_64 lite
            cargo_args: --locked --release --no-default-features
            artifact_prefix: floral-sync-server-lite
            artifact_name: release-windows-x86_64-pc-windows-msvc-lite
            with_admin: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        if: ${{ matrix.with_admin }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install admin UI dependencies
        if: ${{ matrix.with_admin }}
        run: npm --prefix admin-ui ci

      - name: Build release binary
        run: cargo build ${{ matrix.cargo_args }}

      - name: Package Windows artifact
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\floral-sync-server.exe dist\floral-sync-server.exe -Force
          $archiveName = "$($env:ARTIFACT_PREFIX)-v$($env:VERSION)-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path dist\floral-sync-server.exe -DestinationPath (Join-Path dist $archiveName) -Force
          Remove-Item dist\floral-sync-server.exe -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux ${{ matrix.variant_label }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - verify
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            target_label: x86_64-linux-gnu
            variant_label: x86_64-linux-gnu full
            cargo_args: --locked --target x86_64-unknown-linux-gnu --release
            artifact_prefix: floral-sync-server
            artifact_name: release-x86_64-linux-gnu
            with_admin: true
          - target: x86_64-unknown-linux-gnu
            target_label: x86_64-linux-gnu
            variant_label: x86_64-linux-gnu lite
            cargo_args: --locked --target x86_64-unknown-linux-gnu --release --no-default-features
            artifact_prefix: floral-sync-server-lite
            artifact_name: release-x86_64-linux-gnu-lite
            with_admin: false
          - target: x86_64-unknown-linux-musl
            target_label: x86_64-linux-musl
            variant_label: x86_64-linux-musl full
            cargo_args: --locked --target x86_64-unknown-linux-musl --release
            artifact_prefix: floral-sync-server
            artifact_name: release-x86_64-linux-musl
            with_admin: true
          - target: x86_64-unknown-linux-musl
            target_label: x86_64-linux-musl
            variant_label: x86_64-linux-musl lite
            cargo_args: --locked --target x86_64-unknown-linux-musl --release --no-default-features
            artifact_prefix: floral-sync-server-lite
            artifact_name: release-x86_64-linux-musl-lite
            with_admin: false
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Setup Node.js
        if: ${{ matrix.with_admin }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install admin UI dependencies
        if: ${{ matrix.with_admin }}
        run: npm --prefix admin-ui ci

      - name: Build release binary
        run: cargo zigbuild ${{ matrix.cargo_args }}

      - name: Package Linux artifact
        shell: bash
        env:
          TARGET_LABEL: ${{ matrix.target_label }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/floral-sync-server" dist/floral-sync-server
          archive_name="${ARTIFACT_PREFIX}-v${VERSION}-${TARGET_LABEL}.tar.gz"
          tar -C dist -czf "dist/${archive_name}" floral-sync-server
          rm dist/floral-sync-server

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-windows
      - build-linux
    timeout-minutes: 15
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Floral Sync Server ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
